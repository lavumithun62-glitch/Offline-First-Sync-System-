services:
  mysql:
    image: mysql:8.0
    container_name: offline-sync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offline_sync}
      MYSQL_USER: ${MYSQL_USER:-offline_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-offline_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: offline-sync-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: offline-sync-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Offline-First Sync System}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-offline_sync}
      MYSQL_USER: ${MYSQL_USER:-offline_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-offline_password}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-offline_user}:${MYSQL_PASSWORD:-offline_password}@mysql:3306/${MYSQL_DATABASE:-offline_sync}
      REDIS_URL: redis://redis:6379/0
      CONFLICT_STRATEGY: ${CONFLICT_STRATEGY:-server_wins}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: offline-sync-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
